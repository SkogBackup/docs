[project]
name = "docgen"
version = "0.1.0"
description = "SkogAI Documentation Frontmatter Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0.0",
    "ollama>=0.4.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.19.0",
    "ollama>=0.4.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pyyaml>=6.0",
    "tenacity>=8.0.0",
    "watchdog>=4.0.0",
]
